<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vremea locala | WeatherWise</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f4f7f6; color: #182b29; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 760px; margin: 0 auto; padding: 36px 20px; }
      header { border-bottom: 2px solid #087f72; padding-bottom: 20px; }
      h1 { margin: 0 0 16px; font-size: 28px; }
      button { padding: 10px 16px; border: 0; border-radius: 4px; background: #087f72; color: white; font: inherit; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      button:focus-visible { outline: 3px solid #d68a20; outline-offset: 3px; }
      #status { min-height: 48px; overflow-wrap: anywhere; }
      #temperature { font-size: 52px; margin: 12px 0; }
      #coordinates { color: #47605d; overflow-wrap: anywhere; }
      dl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; }
      dt, dd { margin: 0; padding: 8px 0; border-bottom: 1px solid #cbd7d3; }
      dd { text-align: right; }
      h2 { font-size: 20px; margin-top: 28px; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: right; padding: 12px 4px; border-bottom: 1px solid #cbd7d3; }
      th:first-child, td:first-child { text-align: left; }
      footer { margin-top: 32px; font-size: 14px; }
      a { color: #087065; }
      [hidden] { display: none; }
    </style>
    <script type="module" src="/local-weather/location.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Vremea la locatia mea</h1>
        <button id="locate" type="button">Actualizeaza locatia</button>
      </header>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="weather" hidden aria-label="Vremea locala">
        <p id="coordinates"></p>
        <p id="temperature"></p>
        <dl>
          <dt>Temperatura resimtita</dt><dd id="feels-like"></dd>
          <dt>Umiditate</dt><dd id="humidity"></dd>
          <dt>Vant</dt><dd id="wind"></dd>
        </dl>
        <h2>Astazi, pe ore</h2>
        <table>
          <thead><tr><th scope="col">Ora</th><th scope="col">Temperatura</th><th scope="col">Ploaie</th></tr></thead>
          <tbody id="hourly-forecast"></tbody>
        </table>
        <h2>Urmatoarele zile</h2>
        <table>
          <thead><tr><th scope="col">Data</th><th scope="col">Min.</th><th scope="col">Max.</th><th scope="col">Ploaie</th></tr></thead>
          <tbody id="forecast"></tbody>
        </table>
        <p><a id="api-link">Date meteo JSON</a></p>
      </section>
      <footer>Date meteo: <a href="https://open-meteo.com/">Open-Meteo</a></footer>
    </main>
  </body>
</html>
