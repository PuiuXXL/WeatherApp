<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Weather Match — AI-powered weather dashboard with dynamic animations, 7-day forecast, and personalized suggestions for Brașov, România." />

  <title>Weather Match</title>

  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            inter:  ['Inter', 'system-ui', 'sans-serif'],
            outfit: ['Outfit', 'Inter', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./styles.css" />
</head>

<body class="font-inter antialiased min-h-screen">

  <!-- ═══════════════════════════════════════
       LAYER 0: Animated Mesh Gradient
       ═══════════════════════════════════════ -->
  <div id="mesh-gradient-layer">
    <div class="mesh-blob"></div>
    <div class="mesh-blob"></div>
    <div class="mesh-blob"></div>
    <div class="mesh-blob"></div>
  </div>

  <!-- ═══════════════════════════════════════
       LAYER 1: Noise Grain Overlay
       ═══════════════════════════════════════ -->
  <div class="noise-overlay"></div>

  <!-- ═══════════════════════════════════════
       LAYER 2: Particle System Canvas
       ═══════════════════════════════════════ -->
  <canvas id="particle-canvas"></canvas>

  <!-- ═══════════════════════════════════════
       LAYER 3: Weather Animations (rain/sun/clouds)
       ═══════════════════════════════════════ -->
  <div id="weather-animation-layer"></div>

  <!-- ═══════════════════════════════════════
       LAYER 4: Cursor Glow Follower
       ═══════════════════════════════════════ -->
  <div id="cursor-glow"></div>

  <!-- ═══════════════════════════════════════
       MAIN CONTENT
       ═══════════════════════════════════════ -->
  <main class="relative z-10 max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12 flex flex-col gap-6">

    <!-- ─── HEADER ─── -->
    <header class="flex items-center justify-between animate-in" data-delay="1">
      <div class="flex items-center gap-3">
        <!-- Logo icon -->
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-violet-500 to-blue-500 flex items-center justify-center shadow-lg shadow-violet-500/30 hover:scale-110 hover:rotate-6 transition-all duration-300 cursor-pointer">
          <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 014-4h.07A5.5 5.5 0 0118 10.5 3.5 3.5 0 0121 14a3 3 0 01-3 3H7a4 4 0 01-4-2z"/>
          </svg>
        </div>
        <span class="font-outfit font-bold text-lg tracking-tight">Weather Match</span>
      </div>
      <p id="current-date" class="text-sm text-white/35 hidden sm:block font-medium"></p>
    </header>

    <form id="location-form" class="location-controls animate-in" role="search">
      <label for="city-query" class="section-label">Oras</label>
      <input id="city-query" name="city" type="search" placeholder="Cauta un oras" minlength="2" required autocomplete="off" />
      <button type="submit">Cauta</button>
      <button id="locate" type="button">Locatia mea</button>
      <button id="refresh" type="button" aria-label="Actualizeaza" title="Actualizeaza">&#8635;</button>
    </form>
    <div id="location-results" class="location-results" aria-label="Rezultate cautare"></div>
    <p id="weather-status" role="status" aria-live="polite"></p>

    <!-- ─── TOP SECTION: Two-column grid ─── -->
    <section class="grid grid-cols-1 md:grid-cols-5 gap-6">

      <!-- ▸ LEFT: Current Weather ▸ -->
      <div class="md:col-span-2 glass-card p-8 md:p-10 flex flex-col justify-between gap-8 animate-in" data-delay="2">

        <!-- Location badge -->
        <div>
          <p class="section-label mb-2 flex items-center gap-2">
            <span class="location-pin">
              <svg class="w-3.5 h-3.5 text-violet-400" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
              </svg>
            </span>
            Current Location
          </p>
          <h1 id="city-name" class="city-name">—</h1>
        </div>

        <!-- Weather icon + Temperature -->
        <div class="flex items-end gap-6">
          <img id="current-weather-icon" class="hero-weather-icon" src="./src/assets/cloudy.svg" alt="" />
          <div class="flex flex-col gap-2">
            <p id="current-temp" class="temp-hero">--</p>
            <span id="current-weather-label" class="weather-pill">—</span>
          </div>
        </div>

        <!-- Stat badges -->
        <div class="flex flex-wrap gap-3">
          <div class="stat-badge">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m8.66-13.66l-.71.71M4.05 19.95l-.71.71M21 12h-1M4 12H3m16.66 7.66l-.71-.71M4.05 4.05l-.71-.71"/>
            </svg>
            Feels like <strong id="stat-feels" class="text-white/90 ml-1">—</strong>
          </div>
          <div class="stat-badge">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/>
            </svg>
            Humidity <strong id="stat-humidity" class="text-white/90 ml-1">—</strong>
          </div>
          <div class="stat-badge">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
            Wind <strong id="stat-wind" class="text-white/90 ml-1">—</strong>
          </div>
        </div>
      </div>

      <!-- ▸ RIGHT: 7-Day Forecast & Chart ▸ -->
      <div class="md:col-span-3 glass-card p-6 md:p-8 flex flex-col gap-5 animate-in" data-delay="3">

        <!-- Header row -->
        <div class="flex items-center justify-between">
          <h2 class="font-outfit font-semibold text-lg">7-Day Forecast</h2>
          <span class="section-label">Temperature Trend</span>
        </div>

        <!-- Chart -->
        <div class="chart-wrapper">
          <canvas id="forecast-chart"></canvas>
        </div>

        <!-- Day cards row -->
        <div id="forecast-day-cards" class="forecast-day-cards"></div>
      </div>
    </section>

    <!-- ─── WAVE DIVIDER ─── -->
    <div class="wave-divider animate-in" data-delay="4">
      <svg viewBox="0 0 1200 40" preserveAspectRatio="none" fill="rgba(139,92,246,0.3)">
        <path d="M0 20 Q150 0 300 20 T600 20 T900 20 T1200 20 T1500 20 T1800 20 V40 H0 Z"/>
      </svg>
    </div>

    <!-- ─── CHATBOT SUGGESTION ─── -->
    <section class="animate-in" data-delay="5">
      <div class="glass-card chatbot-card p-6 md:p-8 flex gap-5 items-start">

        <!-- Gradient overlay -->
        <div class="chatbot-gradient"></div>

        <!-- Bot avatar -->
        <img src="./src/assets/chatbot.svg" alt="AI Assistant" class="chatbot-avatar relative z-[2]" />

        <!-- Message content -->
        <div class="flex flex-col gap-2 min-w-0 relative z-[2]">
          <div class="flex items-center gap-2.5">
            <span class="font-outfit font-semibold text-sm">Weather Match AI</span>
            <span class="text-[10px] px-2.5 py-0.5 rounded-full bg-violet-500/15 text-violet-300 border border-violet-400/20 font-semibold tracking-wide uppercase">
              Smart Tip
            </span>
          </div>
          <p id="chatbot-message" class="chatbot-text" role="status" aria-live="polite"></p>
          <div id="recommendation-days" class="recommendation-days"></div>
        </div>
      </div>
    </section>

    <!-- ─── FOOTER ─── -->
    <footer class="text-center text-xs text-white/20 mt-6 pb-6 animate-in" data-delay="6">
      Weather Match &copy; 2026 &middot; Powered by AI &middot; Real-time animated dashboard
    </footer>
  </main>

  <!-- App Script -->
  <script type="module" src="./script.js"></script>
</body>
</html>
